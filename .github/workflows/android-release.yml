name: Build Dar Maram Play Store Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              case "$name" in KEYSTORE_BASE64) secret_name="ANDROID_KEYSTORE_BASE64" ;; KEYSTORE_PASSWORD) secret_name="ANDROID_KEYSTORE_PASSWORD" ;; KEY_ALIAS) secret_name="ANDROID_KEY_ALIAS" ;; KEY_PASSWORD) secret_name="ANDROID_KEY_PASSWORD" ;; esac
              echo "::error::Missing GitHub Actions secret: $secret_name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the four Android signing secrets in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dar-maram-upload-key.jks"
          test -s "$RUNNER_TEMP/dar-maram-upload-key.jks"

      - name: Build signed Play Store AAB
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dar-maram-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dar-maram-store-play-release-aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/dar-maram-upload-key.jks"
